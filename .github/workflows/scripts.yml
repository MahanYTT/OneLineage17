name: device scripts

# Offline checks for the scripts that run on the phone: line endings (CRLF in
# master_inner.sh once caused a black-screen boot), binary integrity of
# zygote_exec, syntax under mksh (Android's /system/bin/sh), busybox ash and
# dash, including every script embedded as a heredoc, shellcheck errors, a
# private-data scan, and unit tests of the watchdog logic against fake sysfs
# trees. These checks cannot prove anything about behaviour on the device.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shells and linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh busybox dash shellcheck file
      - name: Run all checks
        run: sh tests/run_all.sh
